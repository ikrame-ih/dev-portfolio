<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card</title>
    <style>
      @font-face {
        font-family: FrauncesVar;
        font-style: normal;
        font-weight: 100 900;
        src: url("../public/fonts/fraunces-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: JetBrainsMono;
        font-style: normal;
        font-weight: 400;
        src: url("../public/fonts/jetbrains-mono-400.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f5f1eb;
      }
      .card {
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 72px 88px;
        background: linear-gradient(135deg, #f5f1eb 0%, #efeae2 55%, #e6dfd3 100%);
        color: #1a1a1a;
        position: relative;
      }
      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 10px;
        background: #4a0e0e;
      }
      .photo-wrap {
        flex: 0 0 360px;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid #4a0e0e;
        box-shadow: 0 18px 40px rgba(26, 26, 26, 0.12);
        background: #e6dfd3;
      }
      .photo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 18%;
      }
      .copy {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
        min-width: 0;
      }
      .handle {
        font-family: FrauncesVar, Georgia, serif;
        font-size: 84px;
        font-weight: 560;
        letter-spacing: -0.03em;
        line-height: 0.95;
        color: #1a1a1a;
      }
      .sub {
        font-family: JetBrainsMono, ui-monospace, monospace;
        font-size: 28px;
        letter-spacing: 0.02em;
        color: #3a3a3a;
      }
      .badge {
        align-self: flex-start;
        margin-top: 10px;
        font-family: JetBrainsMono, ui-monospace, monospace;
        font-size: 22px;
        letter-spacing: 0.14em;
        text-transform: lowercase;
        color: #f5f1eb;
        background: #4a0e0e;
        padding: 12px 20px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="photo-wrap">
        <img src="../public/images/profile-ikrame-640.jpg" alt="" width="640" height="735" />
      </div>
      <div class="copy">
        <div class="handle">@ikrameih</div>
        <div class="sub">Backend · FastAPI · GenAI</div>
        <div class="badge">ikrame.dev</div>
      </div>
    </div>
  </body>
</html>
